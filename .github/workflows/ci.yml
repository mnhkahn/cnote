name: Build and test
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: sh scripts/test-updater.sh
      - run: sh scripts/test-shortcuts.sh
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run check:tools
      - run: npx playwright install chromium webkit
      - run: npm test
      - name: Build app bundle
        env:
          CNOTE_ALLOW_ADHOC: '1'
        run: sh scripts/package.sh debug
      - name: Native GPUI and WebKit smoke test
        if: ${{ vars.CNOTE_NATIVE_UI_TESTS == 'true' }}
        run: python3 scripts/smoke-test.py
      - run: ditto -c -k --sequesterRsrc --keepParent dist/CNote.app dist/CNote-development.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CNote-macOS-development
          path: dist/CNote-development.zip

  warm-release-cache:
    # Tag runs can restore default-branch caches, but cannot reuse other tags.
    # Use the same checkout path, environment, and shared key as release.yml.
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        working-directory: cnote
        shell: bash
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          path: cnote
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cnote
          shared-key: macos-release-${{ matrix.arch }}
      - name: Warm test dependencies and run Rust tests
        run: cargo test --locked
      - name: Warm optimized release dependencies
        run: cargo build --release --locked

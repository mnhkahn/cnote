name: Shared core and pages
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: shared-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: shared/core
      - run: cargo fmt --manifest-path shared/core/Cargo.toml -- --check
      - run: cargo clippy --manifest-path shared/core/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path shared/core/Cargo.toml --locked
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run test:trello-download
      - run: npm run test:mobile-state
      - name: Validate shared page generation
        run: node scripts/build-shared-pages.cjs
  build:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Package portable sources and pages
        shell: bash
        run: |
          version=development
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME#[vV]}"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          fi
          python3 scripts/build-shared-source.py --version "$version"
      - uses: actions/upload-artifact@v4
        with:
          name: cnote-shared
          path: dist/shared/
          if-no-files-found: error

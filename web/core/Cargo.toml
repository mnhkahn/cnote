[package]
name = "cnote-web"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.130"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
html5ever = "0.29.1"

[profile.release]
lto = true
opt-level = "s"
strip = "debuginfo"

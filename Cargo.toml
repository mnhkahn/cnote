[package]
name = "cnote"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "A fast, local-first GPUI notebook with OneDrive sync"
license = "MIT"

[dependencies]
anyhow = "1"
base64 = "0.22"
async-channel = "2"
chrono = { version = "0.4", default-features = false, features = ["std"] }
gpui = { package = "gpui-pre", version = "=0.3.7" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.7", features = ["font-kit", "runtime_shaders"] }
wry = { package = "lb-wry", version = "=0.53.3" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
keyring = { version = "3", features = ["apple-native"] }
uuid = { version = "1", features = ["v4"] }
directories = "6"
url = "2"
html5ever = "0.29.1"

[build-dependencies]
cc = "1"

[dev-dependencies]
tempfile = "3"
ttf-parser = "0.25"

[profile.dev]
debug = 0

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

<section id="local-tools" hidden aria-label="本地工具">
 <section id="text-tool" class="tool-page" hidden>
  <h1 class="text-title">文本处理大师</h1>
  <div class="text-toolbar" aria-label="文本处理工具栏">
   <div class="text-button-group"><button data-text-op="format" class="primary">格式化</button><button data-text-op="trim-empty" title="剔除空行"><s>空行</s></button><button data-text-op="join" title="剔除换行"><s>换行</s></button><button data-text-op="sort">排序</button><button data-text-op="unique">排序&amp;去重</button><button data-text-op="smartdecode">智能解码</button></div>
   <div class="text-input-group"><input id="text-filter" placeholder="按行过滤" aria-label="按行过滤" title="正则表达式，回车或离开输入框时执行"><input id="text-remove" placeholder="字符删除" aria-label="字符删除" title="删除指定文本，回车或离开输入框时执行"></div>
   <div class="text-input-group"><span>Cut</span><input id="text-delimiter" placeholder="分隔符" aria-label="分隔符"><input id="text-field" placeholder="Field" aria-label="提取第几列" type="number" min="1" title="列号从 1 开始，回车或离开输入框时执行"><span>换行</span><input id="text-newline" placeholder="替换" aria-label="替换为换行" title="回车或离开输入框时执行"></div>
  </div>
  <div class="text-single-editor"><div id="tool-text-editor" class="tool-code" aria-label="文本处理编辑器"></div><button id="text-copy" class="text-editor-copy">复制</button></div>
  <div class="text-status"><span id="text-input-count"></span><span class="spacer"></span><label><input id="text-show-whitespace" type="checkbox"> 显示空白标记</label><button id="text-undo">撤销</button></div>
  <p id="text-feedback" role="status">输入框按回车或离开时执行 · ⌘Z 撤销 · 自动保存到本机</p>
  <div id="text-decode-layers" aria-label="解码过程"></div>
  <details class="text-help"><summary>用法与正则表达式</summary><div><p>格式化：自动识别 JSON、XML、SQL 和 AI 文本；AI 文本会清理缩进、合并断行。</p><p>按行过滤支持正则表达式；字符删除按原样匹配。Cut 按分隔符提取指定列，列号从 1 开始。</p><p>正则示例：^错误 匹配行首；a|b 匹配任一关键词；\d 匹配数字。按住 Option 拖动可进行列选择。</p></div></details>
 </section>
 <section id="diff-tool" class="tool-page" hidden>
  <div class="tool-toolbar"><strong>文本对比</strong><button id="diff-run" class="primary">对比</button><button data-diff-op="sort">两侧排序</button><button data-diff-op="unique">排序去重</button><button data-diff-op="format">两侧格式化</button><button id="diff-copy-removed">复制删除内容</button><button id="diff-copy-added">复制新增内容</button><span id="diff-count"></span></div>
  <div class="diff-inputs"><div class="diff-input"><label>原始文本</label><div id="tool-diff-left" class="tool-code" aria-label="原始文本"></div></div><div class="diff-input"><label>修改后文本</label><div id="tool-diff-right" class="tool-code" aria-label="修改后文本"></div></div></div>
  <div class="tool-toolbar"><button id="diff-prev">上一页</button><span id="diff-page"></span><button id="diff-next">下一页</button></div>
  <div id="diff-output" class="tool-scroll" aria-label="差异结果"></div>
 </section>
 <section id="csv-tool" class="tool-page" hidden>
  <div class="tool-toolbar"><strong>表格</strong><button id="table-open-file">导入文件</button><input hidden id="table-file" type="file" accept=".csv,.tsv,.json,.jsonl,.ndjson,.xlsx,.html,.htm,.md,.sql" aria-label="导入表格文件"><select id="table-import-format" aria-label="导入格式"><option value="csv">CSV / TSV</option><option value="json">JSON</option><option value="jsonl">JSONL</option><option value="markdown">Markdown</option><option value="html">HTML</option><option value="sql">SQL INSERT</option></select><button id="table-import" class="primary">导入文本</button></div>
  <textarea id="table-input" placeholder="粘贴 CSV、TSV、JSON 或其他表格文本，第一行作为表头" aria-label="表格导入文本" maxlength="20971520"></textarea>
  <div class="tool-toolbar"><button id="table-undo">撤销</button><button id="table-redo">重做</button><button data-table-op="transpose">转置</button><button data-table-op="unique">去重</button><button id="table-add-row">加行</button><button id="table-delete-row">删行</button><button id="table-add-column">加列</button><button id="table-delete-column">删列</button><button id="table-count">计数 / 统计</button></div>
  <div class="tool-toolbar"><select id="table-column" aria-label="操作列"></select><button data-table-op="sort" data-ascending="true">升序</button><button data-table-op="sort" data-ascending="false">降序</button><input id="table-filter" placeholder="按列筛选，操作可撤销" aria-label="列筛选"><button data-table-op="filter">筛选并保留</button><select id="table-export-format" aria-label="导出格式"><option value="csv">CSV</option><option value="xlsx">Excel</option><option value="json">JSON</option><option value="jsonl">JSONL</option><option value="html">HTML</option><option value="markdown">Markdown</option><option value="sql">SQL</option></select><button id="table-copy">复制</button><button id="table-export">导出</button><button id="table-print">打印 / PDF</button></div>
  <div class="tool-toolbar"><button id="table-prev">上页</button><span id="table-page"></span><button id="table-next">下页</button><button id="table-col-prev">前列</button><button id="table-col-next">后列</button><span id="table-stats"></span></div>
  <div id="table-grid" class="tool-scroll" aria-label="可编辑表格"></div>
 </section>
 <div id="tool-status" role="status">所有处理均在本机完成</div>
</section>
<div id="tool-print"></div>

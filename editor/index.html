<main><div id="empty"><i class="bi bi-journal-text"></i><h1>把想法，留在这里。</h1><p>新建一篇笔记，或登录 OneDrive 继续记录。<br>离线也能写，联网后自动同步。</p><button class="primary" onclick="cnote.action('new')">新建笔记</button></div><article id="document" hidden><div class="eyebrow">CNOTE / PERSONAL NOTEBOOK</div><h1 id="title" hidden></h1><div id="editor" contenteditable="true" spellcheck="true" role="textbox" aria-label="笔记正文" aria-multiline="true" data-placeholder="开始记录… 支持 Markdown 快捷输入"></div></article></main>
